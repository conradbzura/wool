[project]
name = "shapebench"
version = "0.0.1"
description = "Generalization-across-shapes benchmark suite for task-execution frameworks"
requires-python = ">=3.11"
dependencies = []

# Framework backends are installed per-environment rather than pinned here, so a
# Wool-only or Ray-only run never drags in the other. See README for setup.
[project.optional-dependencies]
ray = ["ray>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shapebench"]

[tool.pyright]
pythonVersion = "3.11"

[tool.ruff]
line-length = 89
